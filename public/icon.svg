<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="jenusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#jenusGrad)" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#jenusGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
  
  <!-- Privacy Shield Base -->
  <path d="M256 110 L370 160 V260 C370 335 320 400 256 420 C192 400 142 335 142 260 V160 Z" fill="url(#shieldGrad)" stroke="url(#jenusGrad)" stroke-width="10" />
  
  <!-- Jenus 'J' Neural Core & Voice Wave -->
  <path d="M280 180 V285 C280 315 255 335 225 335 C195 335 180 315 180 295" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="280" cy="180" r="14" fill="#a855f7" />
  
  <!-- Sound/Synapse Wave Accent -->
  <path d="M315 230 C330 245 330 270 315 285" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" />
  <path d="M335 210 C360 235 360 280 335 305" stroke="#818cf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <circle cx="256" cy="385" r="8" fill="#10b981" />
</svg>
